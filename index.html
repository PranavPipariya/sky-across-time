<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#03050b" />
  <meta name="color-scheme" content="dark" />
  <title>Sky Across Time</title>
  <meta name="description" content="The real night sky over Delhi and Roorkee, from 2003 to tonight." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2303050b'/%3E%3Ccircle cx='11' cy='12' r='1.6' fill='%23eceef4'/%3E%3Ccircle cx='21' cy='9' r='1' fill='%23eceef4'/%3E%3Ccircle cx='18' cy='20' r='1.3' fill='%23eceef4'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet" />
  <link rel="preload" as="image" href="sky/preview_2k.jpg" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="sky" role="img" aria-label="The real night sky over Delhi or Roorkee on any night from 2003 to tonight. Drag the timeline to move through the years, or pick a date. Drag the sky to look around, pinch to zoom."></canvas>
  <canvas id="overlay" aria-hidden="true"></canvas>

  <div id="ui" class="ui hidden">
    <header class="top">
      <div class="when">
        <div id="date" class="date"></div>
        <div id="detail" class="detail"></div>
      </div>
      <div class="controls">
        <div id="places" class="places" role="group" aria-label="Seen from"></div>
        <button id="mute" class="mute" aria-label="Mute sound" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" />
            <path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6" />
            <path class="wave" d="M18 6.6a7.6 7.6 0 0 1 0 10.8" />
            <path class="cross" d="M16 9.5l5 5M21 9.5l-5 5" />
          </svg>
        </button>
      </div>
    </header>

    <footer class="bottom">
      <div id="chips" class="chips" role="group" aria-label="Dates"></div>
      <div id="track" class="track" role="slider" aria-label="Move through the years"><span class="line"></span></div>
    </footer>
  </div>

  <section id="start" class="screen hidden" role="button" tabindex="0" aria-label="Begin">
    <div class="screen-inner">
      <h1>Sky Across Time</h1>
      <p class="begin">Tap to begin</p>
    </div>
    <p class="credit">Sky imagery: NASA/Goddard Space Flight Center Scientific Visualization Studio. Gaia DR2: ESA/Gaia/DPAC. Close-ups: Digitized Sky Survey (STScI/NASA), via CDS Strasbourg.</p>
  </section>

  <section id="gate" class="screen gate hidden">
    <div class="screen-inner">
      <h1>Not yet.</h1>
      <div id="countdown" class="countdown">00:00:00</div>
    </div>
  </section>

  <div id="nogl" class="nogl hidden">This needs a browser with WebGL. Try opening the link in Safari or Chrome.</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
